<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Hi, I'm Danny — I break things.</title>
  <desc>Sometimes I make things too. I am a technology generalist at heart and constantly dabble in new technologies. Here's a few of them.</desc>
  <defs>
    <!-- Pantoken rebrand sea palette; the grid is distinct from the other OG patterns. -->
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00181B"/>
      <stop offset="1" stop-color="#051E22"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#3CC0D4" stroke-width="1.5" opacity="0.4"/>
    </pattern>
    <linearGradient id="pattern-fade">
      <stop stop-color="black"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="pattern-mask" x="280" y="10" width="920" height="620" maskUnits="userSpaceOnUse">
      <rect x="280" y="10" width="920" height="620" fill="url(#pattern-fade)"/>
    </mask>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect x="280" y="10" width="920" height="620" fill="url(#grid)" mask="url(#pattern-mask)"/>
  <rect width="1200" height="10" fill="#0394A5"/>
  <g font-family="Atkinson Hyperlegible Next, Arial, sans-serif">
    <!-- Heading matches the other OG images: Atkinson Hyperlegible Next, 100px bold. -->
    <text x="100" y="290" font-size="100" font-weight="700" letter-spacing="-2" fill="#FFFFFF">Hi, I'm Danny</text>
    <text x="100" y="388" font-size="48" font-weight="700" fill="#BDE9F1">I break things.</text>
    <text x="100" y="444" font-size="29" font-weight="500" fill="#77D8E9">
      <tspan x="100" dy="0">Sometimes I make things too. I am a technology generalist at heart</tspan>
      <tspan x="100" dy="38">and constantly dabble in new technologies. Here's a few of them.</tspan>
    </text>
  </g>
</svg>
