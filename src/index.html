<!doctype html>
<html lang="en" data-pantoken-theme="rebrand" data-pantoken-color="sea">
<head>

  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="iyWahl">
  <meta property="og:title" content="Accessible Web Tools by Danny Wahl | Pantoken &amp; CSSDoc">
  <meta property="og:description" content="Pantoken, CSSDoc, and automatica11y &mdash; tools for building and documenting the accessible web.">
  <meta property="og:url" content="https://iywahl.com/">
  <meta property="og:image" content="https://iywahl.com/assets/social/iywahl-og-light.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="iyWahl. I break things. Danny Wahl. Software, technology, and EdTech.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Accessible Web Tools by Danny Wahl | Pantoken &amp; CSSDoc">
  <meta name="twitter:description" content="Pantoken, CSSDoc, and automatica11y &mdash; tools for building and documenting the accessible web.">

  <link rel="icon" href="/assets/favicon/iywahl-favicon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/assets/favicon/iywahl-favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/assets/favicon/iywahl-favicon.png">
  <link rel="license" href="/third-party-notices.txt">
  <link rel="stylesheet" href="/styles/site.css">
  <script type="module" src="/scripts/color-scheme.js"></script>
</head>
<body>
  <aside class="theme-switcher" aria-label="Appearance" hidden>
    <div class="instui-button-set -toggle -color-secondary -size-sm" role="group" aria-label="Color scheme">
      <button class="instui-button" type="button" data-color-mode="light" aria-label="Light" title="Light" aria-pressed="false"><span class="instui-icon -icon-sun" aria-hidden="true"></span></button>
      <button class="instui-button" type="button" data-color-mode="system" aria-label="System" title="System" aria-pressed="true"><span class="instui-icon -icon-monitor" aria-hidden="true"></span></button>
      <button class="instui-button" type="button" data-color-mode="dark" aria-label="Dark" title="Dark" aria-pressed="false"><span class="instui-icon -icon-moon" aria-hidden="true"></span></button>
    </div>
  </aside>
  <main>
    <h1 class="instui-screen-reader-content">Hi, I'm Danny.</h1>
    <div class="gallery">
      {% for project in projects %}
        {% include "partials/project-card.njk" %}
      {% endfor %}
    </div>
    <footer class="page-footer"><p>&copy; 2026 Danny Wahl | <a href="mailto:danny@iywahl.com">danny@iywahl.com</a></p></footer>
  </main>
</body>
