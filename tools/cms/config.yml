backend:
  name: git-gateway
local_backend:
  url: http://127.0.0.1:8081/api/v1
media_folder: src/blog/posts
public_folder: /blog
site_url: https://iywahl.com
publish_mode: simple
collections:
  - name: posts
    label: Blog Posts
    folder: src/blog/posts
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: "/blog/{{dirname}}"
    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [published_at, title]
    fields:
      - {name: title, label: Title, widget: string}
      - {name: published_at, label: Published, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss.SSS[Z]"}
      - {name: modified_at, label: Updated, widget: datetime, required: false, format: "YYYY-MM-DDTHH:mm:ss.SSS[Z]"}
      - {name: snippet, label: Description, widget: text, required: false}
      - {name: tags, label: Topics, widget: string, required: false}
      - {name: authors, label: Author, widget: string, default: Danny Wahl}
      - {name: draft, label: Draft, widget: boolean, default: true, required: false}
      - {name: body, label: Body, widget: markdown}